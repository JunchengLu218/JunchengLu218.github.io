<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <style>
    /* 自带调色板：外部 SVG 读不到父页面的 CSS 变量，所以颜色必须写在文件里。
       深色模式靠这个 media query，删掉它图就变成固定浅色。 */
    :root {
      --fig-bg: #f2f3f4;
      --fig-line: #9aa3ad;
      --fig-ink: #333c45;
      --fig-a: #1772d0;
      --fig-b: #d97b3f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #1b1f23;
        --fig-line: #6b757f;
        --fig-ink: #c8ced4;
        --fig-a: #6fb6f7;
        --fig-b: #e0955f;
      }
    }
  </style>

              <rect width="320" height="320" fill="var(--fig-bg)" />
              <g transform="translate(0,60)">
              <line x1="24" y1="168" x2="296" y2="168" stroke="var(--fig-ink)" stroke-width="1.6" />
              <!-- without role information: large gap -->
              <rect x="52" y="46" width="30" height="122" fill="var(--fig-a)" opacity="0.75" />
              <rect x="94" y="128" width="30" height="40" fill="var(--fig-b)" opacity="0.75" />
              <path d="M67 36 L67 26 L109 26 L109 118" fill="none" stroke="var(--fig-ink)"
                    stroke-width="1.3" stroke-dasharray="3 3" />
              <!-- with role information: small gap -->
              <rect x="196" y="82" width="30" height="86" fill="var(--fig-a)" opacity="0.75" />
              <rect x="238" y="102" width="30" height="66" fill="var(--fig-b)" opacity="0.75" />
              <path d="M211 72 L211 62 L253 62 L253 92" fill="none" stroke="var(--fig-ink)"
                    stroke-width="1.3" stroke-dasharray="3 3" />
              <!-- arrow between panels -->
              <path d="M146 104 L174 104" stroke="var(--fig-ink)" stroke-width="1.8" />
              <path d="M168 99 L176 104 L168 109 Z" fill="var(--fig-ink)" />
            </g>
            </svg>
