<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <style>
    /* 自带调色板：外部 SVG 读不到父页面的 CSS 变量，所以颜色必须写在文件里。
       深色模式靠这个 media query，删掉它图就变成固定浅色。 */
    :root {
      --fig-bg: #f2f3f4;
      --fig-line: #9aa3ad;
      --fig-ink: #333c45;
      --fig-a: #1772d0;
      --fig-b: #d97b3f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #1b1f23;
        --fig-line: #6b757f;
        --fig-ink: #c8ced4;
        --fig-a: #6fb6f7;
        --fig-b: #e0955f;
      }
    }
  </style>

              <rect width="320" height="320" fill="var(--fig-bg)" />
              <g transform="translate(0,60)">
              <rect x="26" y="72" width="74" height="13" rx="4" fill="var(--fig-a)" opacity="0.75" />
              <rect x="26" y="96" width="50" height="13" rx="4" fill="var(--fig-b)" opacity="0.75" />
              <rect x="26" y="120" width="62" height="13" rx="4" fill="var(--fig-line)" opacity="0.6" />
              <path d="M112 103 L142 103" stroke="var(--fig-ink)" stroke-width="2" />
              <path d="M136 97 L144 103 L136 109 Z" fill="var(--fig-ink)" />
              <path d="M218 46 C252 42 284 66 284 98 C284 132 256 156 222 154 C204 153 196 146 182 143 C160 138 152 122 154 100 C156 76 172 64 190 60 C204 57 206 47 218 46 Z"
                    fill="none" stroke="var(--fig-ink)" stroke-width="2" />
              <path d="M190 60 C200 84 194 120 191 143" fill="none" stroke="var(--fig-line)" stroke-width="1.3" />
              <path d="M232 50 C224 80 232 122 236 152" fill="none" stroke="var(--fig-line)" stroke-width="1.3" />
              <circle cx="250" cy="88" r="15" fill="var(--fig-a)" opacity="0.5" />
              <circle cx="206" cy="118" r="11" fill="var(--fig-b)" opacity="0.5" />
            </g>
            </svg>
