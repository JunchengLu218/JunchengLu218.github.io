<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <style>
    /* 自带调色板：外部 SVG 读不到父页面的 CSS 变量，所以颜色必须写在文件里。
       深色模式靠这个 media query，删掉它图就变成固定浅色。 */
    :root {
      --fig-bg: #f2f3f4;
      --fig-line: #9aa3ad;
      --fig-ink: #333c45;
      --fig-a: #1772d0;
      --fig-b: #d97b3f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #1b1f23;
        --fig-line: #6b757f;
        --fig-ink: #c8ced4;
        --fig-a: #6fb6f7;
        --fig-b: #e0955f;
      }
    }
  </style>

              <g transform="translate(0,60)">
                <line x1="196" y1="30" x2="196" y2="150" stroke="var(--fig-line)" stroke-width="1.2" stroke-dasharray="4 4" />
                <line x1="30" y1="150" x2="292" y2="150" stroke="var(--fig-line)" stroke-width="1.2" />
                <path d="M30 150 L60 146 L84 168 L110 128 L136 160 L164 138 L192 154 L226 146 L292 149"
                      fill="none" stroke="var(--fig-b)" stroke-width="2.2" stroke-linejoin="round" />
              </g>
            </svg>
