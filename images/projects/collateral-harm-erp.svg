<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <style>
    /* 自带调色板：外部 SVG 读不到父页面的 CSS 变量，所以颜色必须写在文件里。
       深色模式靠这个 media query，删掉它图就变成固定浅色。 */
    :root {
      --fig-bg: #f2f3f4;
      --fig-line: #9aa3ad;
      --fig-ink: #333c45;
      --fig-a: #1772d0;
      --fig-b: #d97b3f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #1b1f23;
        --fig-line: #6b757f;
        --fig-ink: #c8ced4;
        --fig-a: #6fb6f7;
        --fig-b: #e0955f;
      }
    }
  </style>

  <rect width="320" height="320" fill="var(--fig-bg)" />

  <!-- P2 (175-225 ms) 和 N2 (240-320 ms) 的测量窗口 -->
  <rect x="135.0" y="44.0" width="13.2" height="232.0"
        fill="var(--fig-line)" opacity="0.16" />
  <rect x="152.2" y="44.0" width="21.1" height="232.0"
        fill="var(--fig-line)" opacity="0.16" />

  <!-- 0 µV 基线与刺激呈现时刻 -->
  <line x1="36.0" y1="160.0" x2="300.0" y2="160.0"
        stroke="var(--fig-line)" stroke-width="1.2" />
  <line x1="88.8" y1="44.0" x2="88.8" y2="276.0"
        stroke="var(--fig-line)" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- 纵轴（正向上），刻度为 ±5 µV -->
  <line x1="36.0" y1="44.0" x2="36.0" y2="276.0"
        stroke="var(--fig-ink)" stroke-width="1.4" />
  <line x1="32.0" y1="70.8" x2="36.0" y2="70.8"
        stroke="var(--fig-ink)" stroke-width="1.4" />
  <line x1="32.0" y1="249.2" x2="36.0" y2="249.2"
        stroke="var(--fig-ink)" stroke-width="1.4" />

  <!-- 中性表情条件（同族） -->
  <path d="M36.0 157.9 L38.1 157.9 L40.2 158.0 L42.3 158.1 L44.4 158.4 L46.6 158.7 L48.7 159.0 L50.8 159.4 L52.9 159.8 L55.0 160.2 L57.1 160.6 L59.2 161.0 L61.3 161.3 L63.5 161.6 L65.6 161.9 L67.7 162.0 L69.8 162.1 L71.9 162.1 L74.0 162.1 L76.1 161.9 L78.2 161.7 L80.4 161.5 L82.5 161.2 L84.6 160.8 L86.7 160.4 L88.8 159.4 L90.9 159.5 L93.0 159.6 L95.1 159.9 L97.2 160.5 L99.4 161.8 L101.5 163.9 L103.6 167.2 L105.7 171.8 L107.8 177.6 L109.9 184.2 L112.0 190.7 L114.1 196.1 L116.3 199.1 L118.4 199.0 L120.5 195.5 L122.6 188.6 L124.7 179.0 L126.8 167.5 L128.9 154.9 L131.0 142.1 L133.2 129.8 L135.3 118.9 L137.4 110.2 L139.5 104.7 L141.6 103.1 L143.7 105.5 L145.8 111.7 L147.9 121.0 L150.0 132.1 L152.2 144.0 L154.3 155.4 L156.4 165.3 L158.5 173.0 L160.6 178.0 L162.7 180.2 L164.8 179.7 L166.9 177.1 L169.1 172.8 L171.2 167.6 L173.3 162.2 L175.4 157.0 L177.5 152.5 L179.6 148.8 L181.7 145.9 L183.8 143.7 L186.0 142.1 L188.1 140.8 L190.2 139.7 L192.3 138.8 L194.4 138.0 L196.5 137.3 L198.6 136.6 L200.7 135.9 L202.8 135.3 L205.0 134.7 L207.1 134.1 L209.2 133.5 L211.3 133.0 L213.4 132.5 L215.5 132.0 L217.6 131.6 L219.7 131.2 L221.9 130.8 L224.0 130.5 L226.1 130.3 L228.2 130.0 L230.3 129.9 L232.4 129.8 L234.5 129.7 L236.6 129.7 L238.8 129.7 L240.9 129.8 L243.0 129.9 L245.1 130.0 L247.2 130.3 L249.3 130.5 L251.4 130.8 L253.5 131.2 L255.6 131.6 L257.8 132.0 L259.9 132.5 L262.0 133.0 L264.1 133.5 L266.2 134.1 L268.3 134.7 L270.4 135.3 L272.5 135.9 L274.7 136.6 L276.8 137.3 L278.9 138.0 L281.0 138.7 L283.1 139.4 L285.2 140.1 L287.3 140.9 L289.4 141.6 L291.6 142.3 L293.7 143.1 L295.8 143.8 L297.9 144.5 L300.0 145.2"
        fill="none" stroke="var(--fig-a)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round" />
</svg>
